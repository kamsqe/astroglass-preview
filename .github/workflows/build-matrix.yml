name: Build Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-matrix:
    name: '${{ matrix.theme }} / ${{ matrix.locales }} / ${{ matrix.palettes }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Each theme with multiple locales & palettes ──
          - theme: liquid
            locales: 'en,fr'
            palettes: 'azure,neonoir,evergreen'
          - theme: glass
            locales: 'en,es,ja'
            palettes: 'nordic,abyss'
          - theme: neo
            locales: 'en,ru,zh'
            palettes: 'solaris,synthwave,rose'
          - theme: luxury
            locales: 'en,kk'
            palettes: 'azure,monochrome'
          - theme: minimal
            locales: 'en,fr,es,ru'
            palettes: 'aquatica'
          - theme: aurora
            locales: 'en,ja,zh,kk'
            palettes: 'neonoir,evergreen,solaris,abyss'

          # ── Single locale (language switcher removed) ──
          - theme: liquid
            locales: 'en'
            palettes: 'azure,nordic'
          - theme: neo
            locales: 'ja'
            palettes: 'synthwave'

          # ── Single palette (palette switcher removed) ──
          - theme: glass
            locales: 'en,fr'
            palettes: 'azure'
          - theme: minimal
            locales: 'en,ru'
            palettes: 'monochrome'

          # ── Single locale + single palette (both switchers removed) ──
          - theme: luxury
            locales: 'en'
            palettes: 'abyss'
          - theme: aurora
            locales: 'fr'
            palettes: 'rose'

          # ── All locales / all palettes (no pruning edge case) ──
          - theme: liquid
            locales: 'en,ru,fr,es,ja,zh,kk'
            palettes: 'azure,nordic,solaris,abyss,neonoir,synthwave,evergreen,rose,aquatica,monochrome'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure project
        run: node scripts/configure-ci.mjs --theme ${{ matrix.theme }} --locales ${{ matrix.locales }} --palettes ${{ matrix.palettes }}

      - name: Build
        run: pnpm build
